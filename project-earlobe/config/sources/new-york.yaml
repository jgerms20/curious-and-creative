# New York City feeds (wave 1; nyc-daily is disabled for now). Read by earlobe.config.load_sources("new-york").
# URLs are from memory and NOT checked (verified: false). The Beat agent confirms each on its first run
# (HTTP 200, parses as RSS/Atom, items are recent), flips verified to true, and drops dead feeds.
# tier: 1 official record, 2 established newsroom, 3 local/specialist. AP and Reuters: use the gnews sensor.
# Note: config/owners.yaml only knows The New York Times for this market; unknown outlets count as their own group.
market: new-york
feeds:
  - {outlet: "The New York Times", url: "https://rss.nytimes.com/services/xml/rss/nyt/NYRegion.xml", kind: article, tier: 2, beats: &all [government, public_safety, housing, transit, business, weather, sports, culture], verified: false}
  - {outlet: "Gothamist", url: "https://gothamist.com/feed", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "New York Daily News", url: "https://www.nydailynews.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "amNY", url: "https://www.amny.com/feed/", kind: article, tier: 3, beats: *all, verified: false}
  - {outlet: "THE CITY", url: "https://www.thecity.nyc/feed/", kind: article, tier: 3, beats: [government, housing, transit, public_safety], verified: false}
  - {outlet: "NBC New York", url: "https://www.nbcnewyork.com/news/local/?rss=y", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "ABC7 New York", url: "https://abc7ny.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "CBS New York", url: "https://www.cbsnews.com/newyork/latest/rss/main", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "PIX11", url: "https://pix11.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "U.S. Attorney, Southern District of New York", url: "https://www.justice.gov/usao-sdny/pr/rss.xml", kind: press_release, tier: 1, beats: [public_safety, government], verified: false}  # justice.gov pattern; guess
  - {outlet: "National Weather Service", url: "https://api.weather.gov/alerts/active.atom?point=40.71,-74.01", kind: official_data, tier: 1, beats: [weather, public_safety], verified: false}
