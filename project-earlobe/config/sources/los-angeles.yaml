# Los Angeles feeds. Read by earlobe.config.load_sources("los-angeles") -> sensors/rss.py.
# URLs are from memory and NOT checked (verified: false). The Beat agent confirms each on its first run
# (HTTP 200, parses as RSS/Atom, items are recent), flips verified to true, and drops dead feeds.
# Court dockets come from the CourtListener sensor (see config/markets.yaml), not from this file.
# tier: 1 official record, 2 established newsroom, 3 local/specialist. AP and Reuters: use the gnews sensor.
market: los-angeles
feeds:
  - {outlet: "Los Angeles Times", url: "https://www.latimes.com/local/rss2.0.xml", kind: article, tier: 2, beats: [government, public_safety, housing, transit, weather, culture], verified: false}
  - {outlet: "Los Angeles Times", url: "https://www.latimes.com/business/rss2.0.xml", kind: article, tier: 2, beats: [entertainment_business, housing], verified: false}
  - {outlet: "Los Angeles Times", url: "https://www.latimes.com/sports/rss2.0.xml", kind: article, tier: 2, beats: [sports], verified: false}
  - {outlet: "LAist", url: "https://laist.com/index.rss", kind: article, tier: 2, beats: &all [government, public_safety, housing, transit, entertainment_business, weather, sports, culture], verified: false}  # pattern from memory
  - {outlet: "KTLA", url: "https://ktla.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "NBC Los Angeles", url: "https://www.nbclosangeles.com/news/local/?rss=y", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "ABC7 Los Angeles", url: "https://abc7.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "CBS Los Angeles", url: "https://www.cbsnews.com/losangeles/latest/rss/main", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "Los Angeles Daily News", url: "https://www.dailynews.com/feed/", kind: article, tier: 2, beats: *all, verified: false}
  - {outlet: "LA Metro", url: "https://thesource.metro.net/feed/", kind: press_release, tier: 1, beats: [transit], verified: false}  # Metro's blog, The Source
  - {outlet: "City of Los Angeles", url: "https://www.lamayor.org/rss.xml", kind: press_release, tier: 1, beats: [government, housing, public_safety], verified: false}  # Drupal /rss.xml pattern; guess
  - {outlet: "LA County District Attorney", url: "https://da.lacounty.gov/rss.xml", kind: press_release, tier: 1, beats: [da_press, criminal_court], verified: false}  # Drupal pattern; guess
  - {outlet: "U.S. Attorney, Central District of California", url: "https://www.justice.gov/usao-cdca/pr/rss.xml", kind: press_release, tier: 1, beats: [federal_court, criminal_court], verified: false}  # justice.gov pattern; guess
  - {outlet: "National Weather Service", url: "https://api.weather.gov/alerts/active.atom?point=34.05,-118.24", kind: official_data, tier: 1, beats: [weather, public_safety], verified: false}
