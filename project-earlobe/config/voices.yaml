# Original synthetic host personas. Not modeled on, named after, or imitating any real person.
# voice_id values come from env (ElevenLabs voice IDs you design in Voice Design) — never commit keys.
engine: elevenlabs
default_tts_model_env: ELEVENLABS_TTS_MODEL
personas:
  mara:   {display_name: "Mara", role: anchor,        voice_id_env: VOICE_MARA,   style: "warm, brisk, Southern-neutral morning anchor"}
  theo:   {display_name: "Theo", role: co-host,       voice_id_env: VOICE_THEO,   style: "curious, conversational, asks the listener's question"}
  lena:   {display_name: "Lena", role: anchor,        voice_id_env: VOICE_LENA,   style: "clear, cinematic, West Coast"}
  marcus: {display_name: "Marcus", role: co-host,     voice_id_env: VOICE_MARCUS, style: "grounded, explains the why"}
  ava:    {display_name: "Ava", role: breaking_anchor, voice_id_env: VOICE_AVA,   style: "calm under pressure, precise, no hype"}
  june:   {display_name: "June", role: courts_and_crime, voice_id_env: VOICE_JUNE, style: "measured, careful with names and allegations"}
disclosure_voice: ava
