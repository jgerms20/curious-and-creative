# Outlet -> owner group, used to count INDEPENDENT sources (same owner group = one source).
# Wire copy (AP, Reuters, AFP) republished by an outlet counts as the wire, not the outlet.
# VERIFY ownership periodically (Industry Intel agent); unknown outlets are treated as their own group.
wires: [Associated Press, Reuters, AFP, Bloomberg]
groups:
  McClatchy: [The State, thestate.com]
  Evening Post Industries: [The Post and Courier, Post and Courier Columbia, Free Times]
  Gray Media: [WIS, WIS News 10, wistv.com]
  TEGNA: [WLTX, WLTX 19, wltx.com]
  States Newsroom: [SC Daily Gazette, scdailygazette.com]
  LA Times: [Los Angeles Times, latimes.com]
  LAist / Southern California Public Radio: [LAist, laist.com, KPCC]
  Nexstar: [KTLA, KTLA 5, ktla.com, The Hill]
  Comcast NBCUniversal: [NBC Los Angeles, NBC4, nbclosangeles.com, Telemundo 52, NBC News, CNBC, MSNBC]
  Disney: [ABC7 Los Angeles, abc7.com, ABC News]
  Paramount: [CBS Los Angeles, KCAL, cbsnews.com, CBS News]
  MediaNews Group: [Los Angeles Daily News, Daily News, Orange County Register, Press-Telegram]
  New York Times Company: [The New York Times, nytimes.com]
  Chicago Public Media: [Chicago Sun-Times, WBEZ]
