# Show registry. The engine reads this; agents/editorial/assignment-editor.md explains the fields.
# lane: standard | strict | breaking | archive  (see earlobe/trust/gate.py POLICIES)
# wave: 0 = test markets (live first), 1 = next, 2+ = later. enabled: false = configured, not running.
shows:
  columbia-daily:
    name: "Columbia Daily"
    network_label: "Curious & Creative Network"
    market: columbia-sc
    lane: standard
    format: daily_brief
    cadence: {type: cron, cron: "0 10 * * 1-5", tz: "America/New_York", local_time: "06:00"}
    target_minutes: [6, 8]
    hosts: [mara, theo]
    beats: [government, public_safety, education, business, development, weather, sports, culture]
    max_stories: 6
    wave: 0
    enabled: true
  la-daily:
    name: "LA Daily"
    network_label: "Curious & Creative Network"
    market: los-angeles
    lane: standard
    format: daily_brief
    cadence: {type: cron, cron: "0 13 * * 1-5", tz: "America/Los_Angeles", local_time: "06:00"}
    target_minutes: [6, 8]
    hosts: [lena, marcus]
    beats: [government, public_safety, housing, transit, entertainment_business, weather, sports, culture]
    max_stories: 7
    wave: 0
    enabled: true
  breaking-desk:
    name: "The Breaking Desk"
    network_label: "Curious & Creative Network"
    market: national
    lane: breaking
    format: breaking_flash
    cadence: {type: event, trigger: "desk.breaking", min_gap_minutes: 30}
    target_minutes: [2, 4]
    hosts: [ava]
    beats: [major_death, attack_or_attempt, disaster, scotus, federal_government, space, sports_mega, business_mega, world]
    wave: 0
    enabled: true
  la-courts:
    name: "LA Courts Roundup"
    network_label: "Curious & Creative Network"
    market: los-angeles
    lane: strict
    format: court_roundup
    cadence: {type: cron, cron: "0 1 * * 2-6", tz: "America/Los_Angeles", local_time: "17:00 (prev day)"}
    target_minutes: [8, 12]
    hosts: [june]
    beats: [criminal_court, civil_court, federal_court, da_press]
    wave: 0
    enabled: true
  case-tracker:
    name: "Case Tracker"
    network_label: "Curious & Creative Network"
    market: national
    lane: strict
    format: case_weekly
    cadence: {type: cron, cron: "0 14 * * 5", tz: "America/New_York", local_time: "Fri 10:00", flash_on: "case.development"}
    target_minutes: [15, 25]
    hosts: [june, theo]
    beats: [tracked_cases]
    wave: 0
    enabled: true
  cold-case-files:
    name: "Cold Case Files"
    network_label: "Curious & Creative Network"
    market: national
    lane: strict
    format: evergreen_story
    cadence: {type: cron, cron: "0 9 * * 2,4", tz: "America/New_York", local_time: "Tue/Thu 05:00"}
    target_minutes: [18, 25]
    hosts: [june]
    beats: [cold_case]
    wave: 0
    enabled: true
  history-of-hollywood:
    name: "History of Hollywood"
    network_label: "Curious & Creative Network"
    market: los-angeles
    lane: archive
    format: evergreen_story
    cadence: {type: cron, cron: "0 9 * * 1,3,5", tz: "America/Los_Angeles", local_time: "Mon/Wed/Fri 02:00"}
    target_minutes: [15, 20]
    hosts: [lena]
    beats: [hollywood_history]
    wave: 0
    enabled: true
  nyc-daily:
    name: "NYC Daily"
    network_label: "Curious & Creative Network"
    market: new-york
    lane: standard
    format: daily_brief
    cadence: {type: cron, cron: "0 10 * * 1-5", tz: "America/New_York", local_time: "06:00"}
    target_minutes: [6, 8]
    hosts: [mara, marcus]
    beats: [government, public_safety, housing, transit, business, weather, sports, culture]
    wave: 1
    enabled: false
  chicago-daily:
    name: "Chicago Daily"
    network_label: "Curious & Creative Network"
    market: chicago
    lane: standard
    format: daily_brief
    cadence: {type: cron, cron: "0 11 * * 1-5", tz: "America/Chicago", local_time: "06:00"}
    target_minutes: [6, 8]
    hosts: [theo, lena]
    beats: [government, public_safety, housing, transit, business, weather, sports, culture]
    wave: 1
    enabled: false
