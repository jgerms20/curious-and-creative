name: Earlobe evergreen and long-form

# Produces the non-daily shows: formats evergreen_story and case_weekly in
# project-earlobe/config/shows.yaml (cold-case-files, history-of-hollywood, case-tracker).
#
# IMPORTANT: GitHub runs `schedule` triggers ONLY from the workflow file on the repository's
# DEFAULT branch. Until this file is merged there, nothing fires by itself; test a branch with
# "Run workflow" (workflow_dispatch) instead. Cron times are UTC and can start several minutes
# late when GitHub is busy. They are fixed UTC, so a show's local air time moves an hour when
# daylight saving changes.
#
# The crons below must match `cadence.cron` in config/shows.yaml for every ENABLED show of these
# formats. tests/test_monitor.py fails when they drift. To switch on a show, set enabled: true in
# shows.yaml and add its cron here.
#
# Nothing here fails red when Earlobe is not set up yet: the preflight job checks the secrets and
# model variables first and, if any is missing, prints "not configured — skipping" and the run job
# is skipped. See earlobe-daily-briefs.yml for the full list of what to configure.
on:
  schedule:
    - cron: "0 9 * * 2,4"     # cold-case-files        Tue/Thu 05:00 America/New_York (EDT)
    - cron: "0 9 * * 1,3,5"   # history-of-hollywood   Mon/Wed/Fri 02:00 America/Los_Angeles (PDT)
    - cron: "0 14 * * 5"      # case-tracker           Fri 10:00 America/New_York (EDT)
  workflow_dispatch:
    inputs:
      show:
        description: "Show id from project-earlobe/config/shows.yaml (must be enabled)"
        required: true
        default: cold-case-files
        type: string

permissions:
  contents: read

concurrency:
  group: earlobe-evergreen
  cancel-in-progress: false

jobs:
  preflight:
    name: Check configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check secrets and model variables
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          EARLOBE_MODEL_OPUS: ${{ vars.EARLOBE_MODEL_OPUS }}
          EARLOBE_MODEL_SONNET: ${{ vars.EARLOBE_MODEL_SONNET }}
          EARLOBE_MODEL_HAIKU: ${{ vars.EARLOBE_MODEL_HAIKU }}
        run: |
          missing=""
          for name in ANTHROPIC_API_KEY ELEVENLABS_API_KEY EARLOBE_MODEL_OPUS EARLOBE_MODEL_SONNET EARLOBE_MODEL_HAIKU; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "not configured — skipping (missing:$missing)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured: all required secrets and variables are set"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Produce episodes
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: project-earlobe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-earlobe/pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Earlobe
        run: python -m pip install -e .

      # Stopgap until the Supabase-backed store lands: carry the SQLite file (budget spend,
      # published episodes, corrections) from one run to the next. Runners start empty.
      - name: Restore the run store
        uses: actions/cache@v4
        with:
          path: project-earlobe/data/earlobe.db
          key: earlobe-store-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: earlobe-store-

      - name: Pick the shows to run
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          SHOW_INPUT: ${{ inputs.show }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys

          from earlobe import config

          FORMATS = {"evergreen_story", "case_weekly"}
          shows = config.load_shows(enabled_only=True)
          wanted = os.environ.get("SHOW_INPUT", "").strip()
          schedule = os.environ.get("SCHEDULE", "").strip()
          if wanted:
              if wanted not in shows:
                  sys.exit(f"unknown or disabled show: {wanted}")
              picked = [wanted]
          else:
              picked = [sid for sid, cfg in shows.items()
                        if cfg.get("format") in FORMATS
                        and (cfg.get("cadence") or {}).get("cron") == schedule]
          print("shows=" + " ".join(picked))
          PY

      - name: Run the shows
        env:
          SHOWS: ${{ steps.pick.outputs.shows }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          TRANSISTOR_API_KEY: ${{ secrets.TRANSISTOR_API_KEY }}
          EARLOBE_MODEL_OPUS: ${{ vars.EARLOBE_MODEL_OPUS }}
          EARLOBE_MODEL_SONNET: ${{ vars.EARLOBE_MODEL_SONNET }}
          EARLOBE_MODEL_HAIKU: ${{ vars.EARLOBE_MODEL_HAIKU }}
          ELEVENLABS_TTS_MODEL: ${{ vars.ELEVENLABS_TTS_MODEL }}
          VOICE_MARA: ${{ vars.VOICE_MARA }}
          VOICE_THEO: ${{ vars.VOICE_THEO }}
          VOICE_LENA: ${{ vars.VOICE_LENA }}
          VOICE_MARCUS: ${{ vars.VOICE_MARCUS }}
          VOICE_AVA: ${{ vars.VOICE_AVA }}
          VOICE_JUNE: ${{ vars.VOICE_JUNE }}
          EARLOBE_PUBLIC_BASE_URL: ${{ vars.EARLOBE_PUBLIC_BASE_URL }}
          EARLOBE_KILL: ${{ vars.EARLOBE_KILL }}
        run: |
          if [ -z "$SHOWS" ]; then
            echo "No enabled show is scheduled for this trigger; nothing to run."
            exit 0
          fi
          status=0
          for show in $SHOWS; do
            echo "::group::$show"
            python -m earlobe run --show "$show" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Publishing to a podcast host comes later; for now the public output is kept as an artifact.
      - name: Upload public output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: earlobe-public-evergreen-${{ github.run_id }}-${{ github.run_attempt }}
          path: project-earlobe/data/public
          if-no-files-found: ignore
          retention-days: 14
