name: Earlobe CI

# Runs the Earlobe engine's tests. They need no API keys and no network: every
# Claude / ElevenLabs / host call has a dry-run path backed by earlobe/fixtures.py.
on:
  push:
    paths:
      - "project-earlobe/**"
      - ".github/workflows/earlobe-*.yml"
  pull_request:
    paths:
      - "project-earlobe/**"
      - ".github/workflows/earlobe-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earlobe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project-earlobe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: project-earlobe/pyproject.toml

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Earlobe
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q
