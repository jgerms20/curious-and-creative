name: Refresh show content

# Pulls real episodes/videos into site/data/content.json on working
# branches (main refreshes inside the Pages deploy instead).
on:
  push:
    branches-ignore:
      - main
    paths:
      - scripts/**
      - site/data/shows.json
      - .github/workflows/refresh-content.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        continue-on-error: true
        run: python3 -m pip install --quiet pillow

      - name: Refresh show content (podcast feeds, YouTube)
        timeout-minutes: 8
        run: python3 scripts/refresh_content.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit refreshed content
        run: |
          git config user.name "cc-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/assets
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Refresh show content from feeds"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
