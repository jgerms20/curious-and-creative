name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # pull new episodes / videos every 6 hours (runs on main)
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        continue-on-error: true
        run: python3 -m pip install --quiet pillow

      - name: Refresh show content (podcast feeds, YouTube)
        timeout-minutes: 8
        continue-on-error: true
        run: python3 scripts/refresh_content.py
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Save refreshed content to the repo
        continue-on-error: true
        run: |
          git config user.name "cc-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/assets
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Refresh show content from feeds"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
